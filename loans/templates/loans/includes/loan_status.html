{% if loan.status == 'completed' %}
    <span class="badge text-bg-success">{{ loan.get_status_display }}</span>
{% elif loan.status == 'cancelled' %}
    <span class="badge text-bg-secondary">{{ loan.get_status_display }}</span>
{% else %}
    <span class="badge text-bg-warning">{{ loan.get_status_display }}</span>
{% endif %}
