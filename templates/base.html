{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт выдачи книг{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex align-items-center flex-wrap">
            <a href="{% url 'homepage:index' %}" class="site-brand">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="Логотип библиотеки"
                    class="site-logo"
                >
                <span>Учёт выдачи книг</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="container site-footer">
        <p>© <span id="current-year"></span> Учёт выдачи книг</p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
